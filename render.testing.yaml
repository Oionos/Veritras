# Separate Render Blueprint; never apply this file to the production service.
services:
  - type: web
    name: veritras-api-testing
    runtime: docker
    plan: free
    region: singapore
    branch: testing
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: commit
    healthCheckPath: /health/live
    # Apply the explicit schema release first; Docker CMD checks it and respects PORT.
    # The existing service is configured through MCP/Dashboard, not Blueprint sync.
    envVars:
      - key: ENVIRONMENT
        value: testing
      - key: CHAIN_ID
        value: "11155111"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ISSUER
        value: veritras-testing-api
      - key: JWT_AUDIENCE
        value: veritras-testing-web
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SIWE_ORIGINS
        sync: false
      - key: SEPOLIA_RPC_URL
        sync: false
      - key: PRODUCT_REGISTRY_CONTRACT
        sync: false
      - key: SHIPMENT_TRACKER_CONTRACT
        sync: false
      - key: INDEXER_START_BLOCK
        sync: false
      - key: INDEXER_ENABLED
        value: "true"
      - key: INDEXER_POLL_INTERVAL
        value: "30"
      - key: INDEXER_CONFIRMATIONS
        value: "12"
      - key: INDEXER_MAX_REORG_DEPTH
        value: "2048"
