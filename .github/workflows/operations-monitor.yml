name: Operations Monitor
on:
  schedule:
    # Four checks a day; avoid keeping free services continuously awake.
    - cron: '15 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: operations-monitor
  cancel-in-progress: false
jobs:
  observe:
    name: Observe ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        environment: [production, testing]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check sustained readiness, API errors and SSE heartbeat
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          api="$(python backend/environment_policy.py --environment "$ENVIRONMENT" --field api_origin)"
          indexing="$(python backend/environment_policy.py --environment "$ENVIRONMENT" --field indexer_mode)"
          python backend/monitor_operations.py --url "$api" --environment "$ENVIRONMENT" --expect-indexer "$indexing"
