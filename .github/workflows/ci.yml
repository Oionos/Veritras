name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blockchain-tests:
    name: Blockchain Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: blockchain/node_modules
          key: ${{ runner.os }}-blockchain-${{ hashFiles('blockchain/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-blockchain-

      - name: Install dependencies
        run: npm ci

      - name: Compile Hardhat contracts
        run: npx hardhat compile

      - name: Run Hardhat tests with coverage
        run: npx hardhat coverage

      - name: Check coverage thresholds
        run: |
          node -e "
          const s = require('./coverage/coverage-summary.json').total;
          const checks = [['statements', 95], ['functions', 95], ['branches', 85]];
          let ok = true;
          checks.forEach(([k, min]) => {
            const pct = s[k].pct;
            if (pct < min) { console.error('FAIL ' + k + ': ' + pct + '% < ' + min + '%'); ok = false; }
            else { console.log('PASS ' + k + ': ' + pct + '%'); }
          });
          if (!ok) process.exit(1);
          "

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: veritras_test
          POSTGRES_PASSWORD: regression-only
          POSTGRES_DB: veritras_indexer_regression
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U veritras_test -d veritras_indexer_regression"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      INDEXER_TEST_DATABASE_URL: postgresql+psycopg2://veritras_test:regression-only@localhost:5432/veritras_indexer_regression
      RECOVERY_TEST_DATABASE_URL: postgresql+psycopg2://veritras_test:regression-only@localhost:5432/veritras_cicd_source
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Check OpenAPI matches the application
        env:
          DATABASE_URL: "sqlite:///:memory:"
          ENVIRONMENT: development
          SEPOLIA_RPC_URL: ""
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          from app.main import app
          assert app.openapi() == json.loads(Path('../openapi.json').read_text()), 'Regenerate openapi.json from app.openapi()'
          PYCODE

      - name: Check environment policy copies
        run: python sync_environment_policy.py

      - name: Create disposable recovery comparison databases
        run: |
          python - <<'PY'
          import psycopg2
          from psycopg2 import sql
          connection = psycopg2.connect(host='localhost', port=5432, user='veritras_test',
                                        password='regression-only', dbname='veritras_indexer_regression')
          connection.autocommit = True
          with connection.cursor() as cursor:
              for name in ('veritras_cicd_source', 'veritras_cicd_target', 'veritras_restore_cicd_regression'):
                  cursor.execute(sql.SQL('CREATE DATABASE {}').format(sql.Identifier(name)))
          connection.close()
          PY

      - name: Run pytest
        env:
          RECOVERY_CLIENT_CONTAINER: ${{ job.services.postgres.id }}
        run: pytest -v --tb=short

      - name: Test private saved-evidence inspection
        run: pytest ../release/tests -q --tb=short

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true
      VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID || 'ci-test-project-id' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm 11
        # npm 10 (bundled with Node 22) rejects npm 11-written lockfiles with
        # spurious "Missing: X from lock file" errors during npm ci.
        run: npm install -g npm@11.17.0

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest unit tests with coverage
        run: npx vitest run --coverage

  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true
      VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID || 'ci-test-project-id' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm 11
        # npm 10 (bundled with Node 22) rejects npm 11-written lockfiles with
        # spurious "Missing: X from lock file" errors during npm ci.
        run: npm install -g npm@11.17.0

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E tests
        run: npx playwright test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true
      VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID || 'ci-test-project-id' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm 11
        # npm 10 (bundled with Node 22) rejects npm 11-written lockfiles with
        # spurious "Missing: X from lock file" errors during npm ci.
        run: npm install -g npm@11.17.0

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        # CI=true ensures warnings are treated as errors for most React/Node build tools

  frontend-lighthouse:
    name: Frontend Lighthouse
    runs-on: ubuntu-latest
    needs: frontend-build
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID || 'ci-test-project-id' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm 11
        # npm 10 (bundled with Node 22) rejects npm 11-written lockfiles with
        # spurious "Missing: X from lock file" errors during npm ci.
        run: npm install -g npm@11.17.0

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Disable AppArmor restrictions for Chrome sandbox
        # TODO: Remove after verifying Ubuntu 24.04 + Chrome stable works
        # without this. The lighthouserc chromeFlags string fix may be
        # sufficient on its own.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Verify Chrome starts with --no-sandbox
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          echo "Chrome path: $CHROME_PATH"
          $CHROME_PATH --no-sandbox --version

      - name: Run Lighthouse CI
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: npx lhci autorun

  openapi-types-check:
    name: OpenAPI Types Drift Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm 11
        # npm 10 (bundled with Node 22) rejects npm 11-written lockfiles with
        # spurious "Missing: X from lock file" errors during npm ci.
        run: npm install -g npm@11.17.0

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install dependencies
        run: npm ci

      - name: Regenerate types from openapi.json
        run: npm run gen:types

      - name: Fail if api.ts is out of sync with openapi.json
        run: |
          if ! git diff --exit-code src/types/api.ts; then
            echo ""
            echo "::error file=frontend/src/types/api.ts::src/types/api.ts is out of sync with openapi.json."
            echo "::error::Run 'npm run gen:types' from the frontend/ directory and commit the result."
            exit 1
          fi
