# Veritras Backend — Render Deployment Configuration
# Documentation: https://render.com/docs/web-services

# This file tells Render how to build and deploy your FastAPI backend.
# No secrets here — those go in Render Dashboard → Environment Variables.

services:
  - type: web
    name: veritras-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 8000
      - key: INDEXER_POLL_INTERVAL
        value: 60
      - key: INDEXER_ENABLED
        value: "false"
      - key: CHAIN_ID
        value: "11155111"
      - key: INDEXER_START_BLOCK
        value: 10779035
      - key: PRODUCT_REGISTRY_CONTRACT
        value: 0x1F76018532D619194f6628ADc186e3c86FcB5AaA
      - key: SHIPMENT_TRACKER_CONTRACT
        value: 0x95b09C0aeD53f6b63C072F4ecaC18861FcbBFB30
      - key: CORS_ORIGINS
        value: https://veritras.vercel.app
      # Secrets to set in Render Dashboard (can also override CORS_ORIGINS there):
      # - DATABASE_URL
      # - SEPOLIA_RPC_URL
      # - JWT_SECRET_KEY  (explicit strong secret required in production)
    healthCheckPath: /health/live
    autoDeploy: true
